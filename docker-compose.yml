# Ambiente local de testes do ToggleMaster.
#
# Por padrão as imagens são construídas a partir do Dockerfile de cada serviço
# irmão — é o modo de desenvolvimento, com ciclo de segundos.
#
# Para validar o artefato real publicado pela esteira, use o override:
#   bash scripts/resolve-image-tags.sh
#   docker compose -f docker-compose.yml -f docker-compose.ecr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ecr.yml up -d --no-build

services:
  # ─── Observabilidade ──────────────────────────────────────────────────────────
  # Destino de toda a telemetria. Os serviços instrumentados falam OTLP com ele,
  # e ele imprime o que recebe (exporter debug) — o equivalente local do que no
  # cluster vai para Datadog, Prometheus e Loki.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: togglemaster-otel-collector
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otel/collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - togglemaster-network

  # ─── Microsserviços ───────────────────────────────────────────────────────────
  auth-service:
    image: togglemaster/auth-service:local
    build:
      context: ../auth-service
    container_name: togglemaster-auth-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgres://auth_user:auth_pass@auth-postgres:5432/auth_db?sslmode=disable
      PORT: "8001"
      MASTER_KEY: admin-secreto-123
      # ── OpenTelemetry ──
      OTEL_SERVICE_NAME: auth-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=togglemaster,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      auth-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - togglemaster-network

  flag-service:
    image: togglemaster/flag-service:local
    build:
      context: ../flag-service
    container_name: togglemaster-flag-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgres://flags_user:flags_pass@flags-postgres:5432/flags_db
      AUTH_SERVICE_URL: http://auth-service:8001
      PORT: "8002"
      # ── OpenTelemetry ──
      # Identidade do serviço: vira o Resource de toda a telemetria emitida.
      OTEL_SERVICE_NAME: flag-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=togglemaster,deployment.environment.name=local
      # Destino: o Collector, e nada além dele.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Log vira registro OTLP, com o contexto de trace preso ao registro.
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOG_CORRELATION: "true"
      # O healthcheck bate a cada 30s e encheria o terminal de spans inúteis.
      OTEL_PYTHON_FLASK_EXCLUDED_URLS: health
    depends_on:
      flags-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - togglemaster-network

  targeting-service:
    image: togglemaster/targeting-service:local
    build:
      context: ../targeting-service
    container_name: togglemaster-targeting-service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgres://targeting_user:targeting_pass@targeting-postgres:5432/targeting_db
      AUTH_SERVICE_URL: http://auth-service:8001
      PORT: "8003"
      # ── OpenTelemetry ──
      OTEL_SERVICE_NAME: targeting-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=togglemaster,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_PYTHON_FLASK_EXCLUDED_URLS: health
    depends_on:
      targeting-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - togglemaster-network

  evaluation-service:
    image: togglemaster/evaluation-service:local
    build:
      context: ../evaluation-service
    container_name: togglemaster-evaluation-service
    env_file:
      - .env
    ports:
      - "8004:8004"
    environment:
      PORT: "8004"
      REDIS_URL: redis://redis:6379/0
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003
      SERVICE_API_KEY: ${EVALUATION_SERVICE_API_KEY:-}
      # ── OpenTelemetry ──
      OTEL_SERVICE_NAME: evaluation-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=togglemaster,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      flag-service:
        condition: service_healthy
      targeting-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8004/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - togglemaster-network

  analytics-service:
    image: togglemaster/analytics-service:local
    build:
      context: ../analytics-service
    container_name: togglemaster-analytics-service
    env_file:
      - .env
    ports:
      - "8005:8005"
    environment:
      PORT: "8005"
      # ── OpenTelemetry ──
      OTEL_SERVICE_NAME: analytics-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=togglemaster,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_PYTHON_FLASK_EXCLUDED_URLS: health
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8005/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - togglemaster-network

  # ─── Bancos de dados ──────────────────────────────────────────────────────────
  # O schema vem do repositório de cada serviço, clonado lado a lado com este.
  auth-postgres:
    image: postgres:16-alpine
    container_name: togglemaster-auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - togglemaster-network

  flags-postgres:
    image: postgres:16-alpine
    container_name: togglemaster-flags-postgres
    environment:
      POSTGRES_DB: flags_db
      POSTGRES_USER: flags_user
      POSTGRES_PASSWORD: flags_pass
    volumes:
      - flags-postgres-data:/var/lib/postgresql/data
      - ../flag-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags_user -d flags_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - togglemaster-network

  targeting-postgres:
    image: postgres:16-alpine
    container_name: togglemaster-targeting-postgres
    environment:
      POSTGRES_DB: targeting_db
      POSTGRES_USER: targeting_user
      POSTGRES_PASSWORD: targeting_pass
    volumes:
      - targeting-postgres-data:/var/lib/postgresql/data
      - ../targeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U targeting_user -d targeting_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - togglemaster-network

  redis:
    image: redis:7-alpine
    container_name: togglemaster-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - togglemaster-network

networks:
  togglemaster-network:
    driver: bridge

volumes:
  postgres-data:
  flags-postgres-data:
  targeting-postgres-data:
